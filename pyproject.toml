[project]
name = "vigenere-squad"
version = "1.0.0"
description = "Ã‰quipe multi-agents qui casse les chiffrements classiques, avec outils dÃ©terministes testÃ©s"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BENNAT Billal" }]
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.optional-dependencies]
demo = ["gradio>=5.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.9", "markdown>=3.6"]

[project.scripts]
vsquad = "vigenere_squad.cli:main"
vsquad-demo = "vigenere_squad.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigenere_squad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/vigenere_squad/outils"]
