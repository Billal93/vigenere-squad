[project]
name = "vigenere-squad"
version = "0.1.0"
description = "Équipe multi-agents qui casse les chiffrements classiques, avec outils déterministes testés"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BENNAT Billal" }]
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.9"]

[project.scripts]
vsquad = "vigenere_squad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigenere_squad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/vigenere_squad/outils"]
